# Foot terminal configuration - Based on Fuzzel color scheme

# `include=` must precede every [section] header — foot only honors it at the
# top level, otherwise it's parsed as a key inside the most recent section.

[main]
term = xterm-256color
font = JetBrainsMono Nerd Font Mono:size=12
dpi-aware = yes
pad = 8x8

[bell]
urgent = yes
notify = yes

[scrollback]
lines = 10000

[url]
launch = xdg-open ${url}

[cursor]
style = block
blink = no

[mouse]
hide-when-typing = yes

[csd]
preferred = none

[colors-dark]
background=2e3440
foreground=e5e9f0
alpha=1.0

regular0=3b4252
regular1=bf616a
regular2=a3be8c
regular3=ebcb8b
regular4=81a1c1
regular5=b48ead
regular6=88c0d0
regular7=e5e9f0

bright0=4c566a
bright1=bf616a
bright2=a3be8c
bright3=ebcb8b
bright4=81a1c1
bright5=b48ead
bright6=8fbcbb
bright7=eceff4
