# Foot terminal configuration - Based on Fuzzel color scheme

# `include=` must precede every [section] header — foot only honors it at the
# top level, otherwise it's parsed as a key inside the most recent section.

[main]
term = xterm-256color
font = JetBrainsMono Nerd Font Mono:size=12
dpi-aware = yes
pad = 8x8

[bell]
urgent = yes
notify = yes

[scrollback]
lines = 10000

[url]
launch = xdg-open ${url}

[cursor]
style = block
blink = no

[mouse]
hide-when-typing = yes

[csd]
preferred = none

[colors]
# Base settings from your Fuzzel config (dropping the trailing 'ff')
background=2e3440
foreground=e5e9f0

# Optional: Adjust background opacity here (0.0 = clear, 1.0 = solid)
alpha=1.0

## Normal/regular colors (Nord palette defaults matching your setup)
regular0=3b4252 # Nord1: selection background
regular1=bf616a # Nord11: red
regular2=a3be8c # Nord14: green
regular3=ebcb8b # Nord13: yellow / fuzzel match
regular4=81a1c1 # Nord9: glaucous blue
regular5=b48ead # Nord15: magenta
regular6=88c0d0 # Nord8: frost cyan / fuzzel prompt & border
regular7=e5e9f0 # Nord4: snow storm / fuzzel text

## Bright colors
bright0=4c566a  # Nord3: fuzzel placeholder & counter
bright1=bf616a
bright2=a3be8c
bright3=ebcb8b
bright4=81a1c1
bright5=b48ead
bright6=8fbcbb  # Nord7: clean teal
bright7=eceff4  # Nord5: bright snow storm
